<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Overwatch 💙</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap');

        /* 맑은 파스텔 하늘색 테마 배경 */
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #bae6fd 100%);
            color: #0f172a; 
            text-align: center; 
            padding: 30px 15px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .container { max-width: 1150px; margin: 0 auto; position: relative; }
        
        /* 헤더 영역 */
        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 42px;
            font-weight: 900;
            color: #0284c7;
            text-shadow: 2px 2px 0px #ffffff, 4px 4px 0px #7dd3fc;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .save-status-bar {
            font-size: 13px;
            font-weight: 900;
            color: #0369a1;
            background: rgba(255, 255, 255, 0.7);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #7dd3fc;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-reset-all {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 900;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-reset-all:hover { background: #dc2626; }

        /* 컨트롤 패널 */
        .control-panel {
            background-color: #ffffff;
            border: 3px solid #38bdf8;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.2);
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 10px 24px;
            font-size: 18px;
            font-weight: 900;
            background: #ffffff;
            border: 2px solid #38bdf8;
            color: #0284c7;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .mode-btn.active {
            background: #0284c7;
            border-color: #0284c7;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            transform: scale(1.03);
        }

        /* 티어 점수 설정 박스 */
        .tier-score-box {
            background: #f8fafc;
            border: 2px dashed #94a3b8;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        .tier-score-title {
            font-size: 17px;
            font-weight: 900;
            color: #334155;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tier-score-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
        }

        .tier-score-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 8px;
            border-radius: 10px;
            align-items: center;
        }

        .tier-score-item label { font-size: 13px; font-weight: 900; }

        .tier-score-item input {
            width: 50px;
            text-align: center;
            border: 1.5px solid #0284c7;
            border-radius: 6px;
            padding: 4px;
            font-size: 14px;
            font-weight: 900;
            outline: none;
        }

        .btn-reset-scores {
            background: #e2e8f0;
            border: 1px solid #94a3b8;
            color: #475569;
            font-size: 12px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-reset-scores:hover { background: #cbd5e1; }

        /* 플레이어 추가/수정 폼 */
        .add-player-box {
            background: #f0f9ff;
            border: 2px dashed #38bdf8;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        .add-player-title {
            font-size: 17px;
            font-weight: 900;
            color: #0369a1;
            margin-bottom: 12px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .form-row input[type="text"] {
            background: #ffffff;
            border: 2px solid #7dd3fc;
            color: #0f172a;
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 900;
            font-family: inherit;
            flex: 1.5;
            min-width: 160px;
            outline: none;
        }

        .form-row input[type="text"]:focus {
            border-color: #0284c7;
            box-shadow: 0 0 8px rgba(2, 132, 199, 0.3);
        }

        .form-group-select {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            font-weight: 900;
        }

        .form-group-select select {
            background: #ffffff;
            border: 2px solid #7dd3fc;
            color: #0f172a;
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 900;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        .btn-add {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 9px 20px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
            transition: background 0.15s;
        }

        .btn-add:hover { background: #0369a1; }

        .btn-cancel {
            background: #64748b;
            color: #ffffff;
            border: none;
            padding: 9px 16px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            display: none;
        }

        .player-selector-title {
            font-size: 18px;
            font-weight: 900;
            color: #0369a1;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        /* 그리드 및 카드 닉네임 수정 부분 */
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 12px;
            text-align: left;
        }

        .player-card {
            background: #ffffff;
            border: 2px solid #bae6fd;
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            position: relative;
            box-shadow: 0 3px 8px rgba(0,0,0,0.04);
            transition: all 0.15s ease-in-out;
        }

        .player-card:hover {
            border-color: #0284c7;
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.2);
        }

        .player-card-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .player-card input[type="checkbox"] {
            accent-color: #0284c7;
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* 닉네임 잘림 방지 스타일 */
        .player-card label {
            cursor: pointer;
            font-size: 15px;
            font-weight: 900;
            color: #0f172a;
            white-space: normal;
            word-break: break-all;
            line-height: 1.3;
        }

        .card-actions { display: flex; gap: 4px; flex-shrink: 0; align-items: center; }

        /* 셀렉트 컨트롤 */
        .select-fixed-role, .select-fixed-team {
            background: #f0f9ff;
            border: 1.5px solid #38bdf8;
            color: #0369a1;
            font-size: 12px;
            font-weight: 900;
            padding: 4px 5px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }

        .select-fixed-team {
            background: #fffbebf8;
            border-color: #f59e0b;
            color: #b45309;
        }

        .btn-edit, .btn-delete {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #334155;
            font-size: 12px;
            font-weight: 900;
            padding: 4px 7px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-edit:hover { background: #0284c7; color: #fff; border-color: #0284c7; }
        .btn-delete:hover { background: #ef4444; color: #fff; border-color: #ef4444; }

        /* 커스텀 툴팁 */
        .has-tooltip { position: relative; }

        .tooltip-box {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 115%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #0f172a;
            border: 1.5px solid #38bdf8;
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 900;
            white-space: nowrap;
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
            z-index: 100;
            transition: opacity 0.2s, visibility 0.2s;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .has-tooltip:hover .tooltip-box {
            visibility: visible;
            opacity: 1;
        }

        .tt-role-tag { color: #94a3b8; margin-right: 4px; }
        .tt-color-그마 { color: #c084fc; }
        .tt-color-마스터 { color: #34d399; }
        .tt-color-다이아 { color: #38bdf8; }
        .tt-color-에메랄드 { color: #10b981; }
        .tt-color-플레 { color: #60a5fa; }
        .tt-color-골드 { color: #facc15; }
        .tt-color-실버 { color: #cbd5e1; }
        .tt-color-브론즈 { color: #f59e0b; }

        /* 매칭 생성 버튼 */
        .match-btn { 
            padding: 16px 48px; 
            font-size: 22px; 
            font-weight: 900; 
            font-family: inherit;
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%); 
            border: 3px solid #ffffff;
            color: #ffffff; 
            border-radius: 25px; 
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.4);
            transition: all 0.2s ease-in-out;
            letter-spacing: 0.5px;
        }

        .match-btn:hover { 
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(2, 132, 199, 0.6);
        }

        .match-btn:active { transform: scale(0.98); }

        .teams { 
            display: flex; 
            justify-content: space-between; 
            margin-top: 35px; 
            gap: 20px; 
        }
        
        .team-box { 
            flex: 1; 
            background-color: #ffffff; 
            border-radius: 20px; 
            padding: 22px; 
            box-sizing: border-box;
            border: 3px solid #7dd3fc;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            position: relative;
        }

        .team-box-a { animation: slideInLeft 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .team-box-b { animation: slideInRight 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .team-title { 
            font-size: 24px; 
            font-weight: 900; 
            margin-bottom: 16px; 
            padding-bottom: 8px; 
            border-bottom: 2px dashed #7dd3fc; 
        }
        
        ul { list-style: none; padding: 0; margin: 0; text-align: left; }
        
        li { 
            padding: 12px 16px; 
            margin-bottom: 10px; 
            border-radius: 12px;
            background-color: #f8fafc;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-left: 8px solid #94a3b8;
            box-shadow: 0 3px 8px rgba(0,0,0,0.04);
            opacity: 0;
            animation: fadeInUp 0.35s ease forwards;
            position: relative;
        }

        li.role-tank-border { border-left-color: #0284c7; }
        li.role-damage-border { border-left-color: #ef4444; }
        li.role-support-border { border-left-color: #10b981; }

        .player-info { display: flex; align-items: center; gap: 10px; word-break: break-all; }
        .player-name { font-size: 17px; font-weight: 900; color: #0f172a; }
        
        /* 티어 뱃지 */
        .tier-badge {
            font-size: 13px; font-weight: 900; padding: 3px 8px; border-radius: 8px; white-space: nowrap;
        }
        .tier-그마 { background-color: #7c3aed; color: #ffffff; } 
        .tier-마스터 { background-color: #10b981; color: #000000; } 
        .tier-다이아 { background-color: #0284c7; color: #ffffff; } 
        .tier-에메랄드 { background-color: #059669; color: #ffffff; } 
        .tier-플레 { background-color: #2563eb; color: #ffffff; } 
        .tier-골드 { background-color: #eab308; color: #000000; } 
        .tier-실버 { background-color: #94a3b8; color: #000000; } 
        .tier-브론즈 { background-color: #b45309; color: #ffffff; } 

        .role-text { font-weight: 900; font-size: 16px; white-space: nowrap; }
        .role-tank { color: #0284c7; }
        .role-damage { color: #ef4444; }
        .role-support { color: #10b981; }

        @keyframes slideInLeft {
            0% { opacity: 0; transform: translateX(-30px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            0% { opacity: 0; transform: translateX(30px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <h1 class="header-title">💙 Overwatch 💙</h1>
            <div class="save-status-bar">
                <span>💾 저장됨 (Auto-Saved)</span>
                <button class="btn-reset-all" onclick="resetAllData()">전체 초기화</button>
            </div>
        </div>

        <div class="control-panel">
            <div class="mode-selector">
                <button class="mode-btn" id="btn-5v5" onclick="selectMode(5)">🔹 5v5 모드 (10명)</button>
                <button class="mode-btn active" id="btn-6v6" onclick="selectMode(6)">🔹 6v6 모드 (12명)</button>
            </div>

            <!-- 티어 점수 직접 설정 패널 -->
            <div class="tier-score-box">
                <div class="tier-score-title">
                    <span>⚙️ 티어별 점수 직접 설정 (SCORE SETTINGS)</span>
                    <button class="btn-reset-scores" onclick="resetTierScores()">기본값 복원</button>
                </div>
                <div class="tier-score-grid" id="tier-score-grid"></div>
            </div>

            <!-- 플레이어 입력/수정 폼 -->
            <div class="add-player-box">
                <div class="add-player-title" id="form-title">➕ 선수 등록하기</div>
                <div class="form-row">
                    <input type="text" id="new-name" placeholder="이름 (예: 홍길동)">
                    
                    <div class="form-group-select">
                        <span style="color:#0284c7;">🛡️ 탱:</span>
                        <select id="new-tank">
                            <option value="none">없음</option>
                            <option value="그마">그마</option>
                            <option value="마스터">마스터</option>
                            <option value="다이아">다이아</option>
                            <option value="에메랄드">에메랄드</option>
                            <option value="플레">플레</option>
                            <option value="골드">골드</option>
                            <option value="실버">실버</option>
                            <option value="브론즈">브론즈</option>
                        </select>
                    </div>

                    <div class="form-group-select">
                        <span style="color:#ef4444;">⚔️ 딜:</span>
                        <select id="new-dps">
                            <option value="none">없음</option>
                            <option value="그마">그마</option>
                            <option value="마스터">마스터</option>
                            <option value="다이아">다이아</option>
                            <option value="에메랄드">에메랄드</option>
                            <option value="플레">플레</option>
                            <option value="골드">골드</option>
                            <option value="실버">실버</option>
                            <option value="브론즈">브론즈</option>
                        </select>
                    </div>

                    <div class="form-group-select">
                        <span style="color:#10b981;">🌿 힐:</span>
                        <select id="new-sup">
                            <option value="none">없음</option>
                            <option value="그마">그마</option>
                            <option value="마스터">마스터</option>
                            <option value="다이아">다이아</option>
                            <option value="에메랄드">에메랄드</option>
                            <option value="플레">플레</option>
                            <option value="골드">골드</option>
                            <option value="실버">실버</option>
                            <option value="브론즈">브론즈</option>
                        </select>
                    </div>

                    <button class="btn-add" id="btn-submit" onclick="submitPlayerForm()">선수 추가</button>
                    <button class="btn-cancel" id="btn-cancel-edit" onclick="resetForm()">취소</button>
                </div>
            </div>

            <div class="player-selector-title">
                <span>참가 플레이어 선택</span>
                <span id="selected-count-label" style="color: #0369a1; font-size: 16px; font-weight:900;">선택됨: 12 / 12명</span>
            </div>

            <div class="player-grid" id="player-checkbox-container"></div>
        </div>

        <button class="match-btn" onclick="handleGenerate()"><span>팀 생성하기 (EXECUTE) 🚀</span></button>

        <div class="teams" id="result" style="display:none;">
            <div class="team-box team-box-a" id="teamA-box">
                <div class="team-title" id="teamA-title" style="color: #0284c7;">🔷 A팀</div>
                <ul id="teamA-list"></ul>
            </div>
            <div class="team-box team-box-b" id="teamB-box">
                <div class="team-title" id="teamB-title" style="color: #ef4444;">🔴 B팀</div>
                <ul id="teamB-list"></ul>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 6;
        let editingPlayerId = null;

        const defaultTierScores = {
            "그마": 8, "마스터": 7, "다이아": 6, "에메랄드": 5, "플레": 4, "골드": 3, "실버": 2, "브론즈": 1
        };

        const defaultPlayers = [
            { id: 0, name: "히지키 (ヒジキ)", roles: { "탱": "그마", "딜": "마스터", "힐": "마스터" }, fixedRole: "auto", fixedTeam: "auto" },
            { id: 1, name: "찬빈 (チャンビン)", roles: { "탱": "마스터", "딜": "그마", "힐": "그마" }, fixedRole: "auto", fixedTeam: "auto" },
            { id: 2, name: "이라카 (イラカ)", roles: { "탱": "다이아", "딜": "플레", "힐": "마스터" }, fixedRole: "auto", fixedTeam: "auto" },
            { id: 3, name: "츄리 (チュリ)", roles: { "딜": "다이아" }, fixedRole: "auto", fixedTeam: "auto" },
            { id: 4, name: "스이소 (スイソ)", roles: { "탱": "다이아", "딜": "에메랄드", "힐": "다이아" }, fixedRole: "auto", fixedTeam: "auto" },
            { id: 5, name: "팽팽 (ペンペン)", roles: { "탱": "플레", "딜": "플레", "힐": "플레" }, fixedRole: "auto", fixedTeam: "auto" },
            { id: 6, name: "테루루 (テルル)", roles: { "탱": "플레", "딜": "플레", "힐": "플레" }, fixedRole: "auto", fixedTeam: "auto" },
            { id: 7, name: "유즈키 (ユズキ)", roles: { "탱": "골드", "딜": "골드", "힐": "플레" }, fixedRole: "auto", fixedTeam: "auto" },
            { id: 8, name: "봉래 (ホウライ)", roles: { "탱": "플레", "딜": "골드", "힐": "골드" }, fixedRole: "auto", fixedTeam: "auto" },
            { id: 9, name: "채연 (チェヨン)", roles: { "힐": "플레" }, fixedRole: "auto", fixedTeam: "auto" },
            { id: 10, name: "카이 (カイ)", roles: { "탱": "플레", "딜": "다이아", "힐": "플레" }, fixedRole: "auto", fixedTeam: "auto" },
            { id: 11, name: "사바 (サバ)", roles: { "탱": "마스터", "딜": "마스터" }, fixedRole: "auto", fixedTeam: "auto" },
            { id: 12, name: "윤덕 (ユンドク)", roles: { "탱": "다이아", "딜": "마스터", "힐": "다이아" }, fixedRole: "auto", fixedTeam: "auto" },
            { id: 13, name: "유키 (ユキ)", roles: { "딜": "골드", "힐": "골드" }, fixedRole: "auto", fixedTeam: "auto" }
        ];

        let tierScores = loadTierScores();
        let allPlayers = loadPlayers();
        let nextPlayerId = getNextPlayerId();

        const tierJpMap = {
            "그마": "グラマス", "마스터": "マスター", "다이아": "ダイヤ", 
            "에메랄드": "エメラルド", "플레": "プラチナ", "골드": "ゴールド",
            "실버": "シルバー", "브론즈": "ブロンズ"
        };

        const roleJpMap = { "탱": "タンク", "딜": "ダメージ", "힐": "サポート" };

        function saveToStorage() {
            localStorage.setItem("ow_matchmaker_players", JSON.stringify(allPlayers));
            localStorage.setItem("ow_matchmaker_scores", JSON.stringify(tierScores));
        }

        function loadPlayers() {
            const saved = localStorage.getItem("ow_matchmaker_players");
            if (!saved) return [...defaultPlayers];
            let parsed = JSON.parse(saved);
            return parsed.map(p => ({ 
                ...p, 
                fixedRole: p.fixedRole || "auto",
                fixedTeam: p.fixedTeam || "auto"
            }));
        }

        function loadTierScores() {
            const saved = localStorage.getItem("ow_matchmaker_scores");
            return saved ? JSON.parse(saved) : { ...defaultTierScores };
        }

        function getNextPlayerId() {
            if (allPlayers.length === 0) return 1;
            return Math.max(...allPlayers.map(p => p.id)) + 1;
        }

        function resetAllData() {
            if (confirm("모든 데이터를 초기 상태로 복원하시겠습니까? (선수 목록 및 점수가 초기화됩니다)")) {
                localStorage.removeItem("ow_matchmaker_players");
                localStorage.removeItem("ow_matchmaker_scores");
                allPlayers = [...defaultPlayers];
                tierScores = { ...defaultTierScores };
                nextPlayerId = getNextPlayerId();
                initTierScoreUI();
                initPlayerCheckboxes();
            }
        }

        function initTierScoreUI() {
            const container = document.getElementById("tier-score-grid");
            container.innerHTML = "";

            Object.keys(tierScores).forEach(tier => {
                const div = document.createElement("div");
                div.className = "tier-score-item";
                div.innerHTML = `
                    <label class="tier-badge tier-${tier}">${tier}</label>
                    <input type="number" value="${tierScores[tier]}" onchange="updateTierScore('${tier}', this.value)">
                `;
                container.appendChild(div);
            });
        }

        function updateTierScore(tier, val) {
            const num = parseInt(val);
            if (!isNaN(num)) {
                tierScores[tier] = num;
                saveToStorage();
            }
        }

        function resetTierScores() {
            tierScores = { ...defaultTierScores };
            initTierScoreUI();
            saveToStorage();
        }

        function getPlayerRolesTooltipHtml(roles) {
            let parts = [];
            if (roles["탱"]) {
                let tier = roles["탱"];
                let jp = tierJpMap[tier] || tier;
                parts.push(`<div><span class="tt-role-tag">🛡️ 탱:</span><span class="tt-color-${tier}">${tier} (${jp})</span></div>`);
            }
            if (roles["딜"]) {
                let tier = roles["딜"];
                let jp = tierJpMap[tier] || tier;
                parts.push(`<div><span class="tt-role-tag">⚔️ 딜:</span><span class="tt-color-${tier}">${tier} (${jp})</span></div>`);
            }
            if (roles["힐"]) {
                let tier = roles["힐"];
                let jp = tierJpMap[tier] || tier;
                parts.push(`<div><span class="tt-role-tag">🌿 힐:</span><span class="tt-color-${tier}">${tier} (${jp})</span></div>`);
            }
            return parts.join("");
        }

        function setPlayerFixedRole(id, role) {
            let player = allPlayers.find(p => p.id === id);
            if (player) {
                player.fixedRole = role;
                saveToStorage();
            }
        }

        function setPlayerFixedTeam(id, team) {
            let player = allPlayers.find(p => p.id === id);
            if (player) {
                player.fixedTeam = team;
                saveToStorage();
            }
        }

        function initPlayerCheckboxes() {
            const container = document.getElementById("player-checkbox-container");
            container.innerHTML = "";

            const targetCount = currentMode * 2;
            allPlayers.forEach((player, index) => {
                const isChecked = index < targetCount;
                const tooltipHtml = getPlayerRolesTooltipHtml(player.roles);
                const fixedRole = player.fixedRole || "auto";
                const fixedTeam = player.fixedTeam || "auto";
                
                const card = document.createElement("div");
                card.className = "player-card has-tooltip";
                card.innerHTML = `
                    <div class="tooltip-box">${tooltipHtml}</div>
                    <div class="player-card-left">
                        <input type="checkbox" id="chk-${player.id}" value="${player.id}" ${isChecked ? "checked" : ""} onchange="updateSelectedCount()">
                        <label for="chk-${player.id}">${player.name}</label>
                    </div>
                    <div class="card-actions">
                        <select class="select-fixed-role" onchange="setPlayerFixedRole(${player.id}, this.value)" title="포지션 고정">
                            <option value="auto" ${fixedRole === "auto" ? "selected" : ""}>포지션 자동</option>
                            <option value="탱" ${fixedRole === "탱" ? "selected" : ""}>🛡️ 탱</option>
                            <option value="딜" ${fixedRole === "딜" ? "selected" : ""}>⚔️ 딜</option>
                            <option value="힐" ${fixedRole === "힐" ? "selected" : ""}>🌿 힐</option>
                        </select>

                        <select class="select-fixed-team" onchange="setPlayerFixedTeam(${player.id}, this.value)" title="팀 고정">
                            <option value="auto" ${fixedTeam === "auto" ? "selected" : ""}>팀 자동</option>
                            <option value="A" ${fixedTeam === "A" ? "selected" : ""}>🔷 A팀</option>
                            <option value="B" ${fixedTeam === "B" ? "selected" : ""}>🔴 B팀</option>
                        </select>

                        <button class="btn-edit" onclick="startEditPlayer(${player.id})">수정</button>
                        <button class="btn-delete" onclick="deletePlayer(${player.id})">삭제</button>
                    </div>
                `;
                container.appendChild(card);
            });
            updateSelectedCount();
        }

        function submitPlayerForm() {
            const nameInput = document.getElementById("new-name");
            const name = nameInput.value.trim();

            if (!name) {
                alert("선수 이름을 입력해 주세요!");
                return;
            }

            const tankTier = document.getElementById("new-tank").value;
            const dpsTier = document.getElementById("new-dps").value;
            const supTier = document.getElementById("new-sup").value;

            let roles = {};
            if (tankTier !== "none") roles["탱"] = tankTier;
            if (dpsTier !== "none") roles["딜"] = dpsTier;
            if (supTier !== "none") roles["힐"] = supTier;

            if (Object.keys(roles).length === 0) {
                alert("최소 하나 이상의 티어를 선택해 주세요!");
                return;
            }

            if (editingPlayerId !== null) {
                let target = allPlayers.find(p => p.id === editingPlayerId);
                if (target) {
                    target.name = name;
                    target.roles = roles;
                }
            } else {
                const newPlayer = {
                    id: nextPlayerId++,
                    name: name,
                    roles: roles,
                    fixedRole: "auto",
                    fixedTeam: "auto"
                };
                allPlayers.push(newPlayer);
            }

            saveToStorage();
            resetForm();
            initPlayerCheckboxes();
        }

        function startEditPlayer(id) {
            let player = allPlayers.find(p => p.id === id);
            if (!player) return;

            editingPlayerId = id;
            document.getElementById("form-title").innerText = `✏️ 선수 정보 수정 중 (${player.name})`;
            document.getElementById("new-name").value = player.name;
            document.getElementById("new-tank").value = player.roles["탱"] || "none";
            document.getElementById("new-dps").value = player.roles["딜"] || "none";
            document.getElementById("new-sup").value = player.roles["힐"] || "none";

            document.getElementById("btn-submit").innerText = "수정 완료";
            document.getElementById("btn-cancel-edit").style.display = "inline-block";
        }

        function resetForm() {
            editingPlayerId = null;
            document.getElementById("form-title").innerText = "➕ 선수 등록하기";
            document.getElementById("new-name").value = "";
            document.getElementById("new-tank").value = "none";
            document.getElementById("new-dps").value = "none";
            document.getElementById("new-sup").value = "none";

            document.getElementById("btn-submit").innerText = "선수 추가";
            document.getElementById("btn-cancel-edit").style.display = "none";
        }

        function deletePlayer(id) {
            if (editingPlayerId === id) resetForm();
            allPlayers = allPlayers.filter(p => p.id !== id);
            saveToStorage();
            initPlayerCheckboxes();
        }

        function selectMode(mode) {
            currentMode = mode;
            document.getElementById("btn-5v5").className = mode === 5 ? "mode-btn active" : "mode-btn";
            document.getElementById("btn-6v6").className = mode === 6 ? "mode-btn active" : "mode-btn";
            updateSelectedCount();
        }

        function updateSelectedCount() {
            const checkedBoxes = document.querySelectorAll('#player-checkbox-container input[type="checkbox"]:checked');
            const targetCount = currentMode * 2;
            const label = document.getElementById("selected-count-label");
            
            label.innerText = `선택됨: ${checkedBoxes.length} / ${targetCount}명 필요`;
            if (checkedBoxes.length === targetCount) {
                label.style.color = "#0284c7";
            } else {
                label.style.color = "#ef4444";
            }
        }

        function getSelectedPlayers() {
            const checkedBoxes = document.querySelectorAll('#player-checkbox-container input[type="checkbox"]:checked');
            let selected = [];
            checkedBoxes.forEach(box => {
                let id = parseInt(box.value);
                let found = allPlayers.find(p => p.id === id);
                if (found) selected.push(found);
            });
            return selected;
        }

        function playPopSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(850, now + 0.15);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.15);

            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        function getAllPossibleTeamAssignments(team, targetMode) {
            let allAssignments = [];
            let reqTank = targetMode === 5 ? 1 : 2;
            let reqDps = 2;
            let reqSup = 2;
            let teamSize = targetMode;

            function backtrack(index, tCount, dCount, sCount, currentAssignment) {
                if (tCount > reqTank || dCount > reqDps || sCount > reqSup) return;
                if (index === teamSize) {
                    if (tCount === reqTank && dCount === reqDps && sCount === reqSup) {
                        allAssignments.push([...currentAssignment]);
                    }
                    return;
                }

                const player = team[index];
                const fixed = player.fixedRole || "auto";

                let availableRoles = Object.keys(player.roles);
                if (fixed !== "auto") {
                    if (availableRoles.includes(fixed)) {
                        availableRoles = [fixed];
                    } else {
                        return;
                    }
                }

                for (let r of availableRoles) {
                    let tierName = player.roles[r];
                    let score = tierScores[tierName];
                    let item = { player, assignedRole: r, tierName, score };

                    if (r === "탱" && tCount < reqTank) backtrack(index + 1, tCount + 1, dCount, sCount, [...currentAssignment, item]);
                    if (r === "딜" && dCount < reqDps) backtrack(index + 1, tCount, dCount + 1, sCount, [...currentAssignment, item]);
                    if (r === "힐" && sCount < reqSup) backtrack(index + 1, tCount, dCount, sCount + 1, [...currentAssignment, item]);
                }
            }

            backtrack(0, 0, 0, 0, []);
            return allAssignments;
        }

        function handleGenerate() {
            const activePlayers = getSelectedPlayers();
            const targetTotal = currentMode * 2;

            if (activePlayers.length !== targetTotal) {
                alert(`${currentMode}v${currentMode} 매칭을 하려면 정확히 ${targetTotal}명을 선택해 주세요! (현재: ${activePlayers.length}명)`);
                return;
            }

            playPopSound();
            generateTeams(activePlayers);
        }

        function generateTeams(selectedList) {
            let validCombinations = [];
            let n = selectedList.length;
            let half = currentMode;

            for (let i = 0; i < (1 << n); i++) {
                let count = 0;
                for (let j = 0; j < n; j++) if (i & (1 << j)) count++;
                
                if (count === half) {
                    let teamA = [], teamB = [];
                    let isTeamValid = true;

                    for (let j = 0; j < n; j++) {
                        let p = selectedList[j];
                        let inTeamA = (i & (1 << j)) !== 0;

                        if (p.fixedTeam === "A" && !inTeamA) { isTeamValid = false; break; }
                        if (p.fixedTeam === "B" && inTeamA) { isTeamValid = false; break; }

                        if (inTeamA) teamA.push(p);
                        else teamB.push(p);
                    }

                    if (!isTeamValid) continue;

                    let possibleA = getAllPossibleTeamAssignments(teamA, currentMode);
                    let possibleB = getAllPossibleTeamAssignments(teamB, currentMode);

                    if (possibleA.length > 0 && possibleB.length > 0) {
                        for (let assignA of possibleA) {
                            for (let assignB of possibleB) {
                                let scoreA = assignA.reduce((sum, item) => sum + item.score, 0);
                                let scoreB = assignB.reduce((sum, item) => sum + item.score, 0);
                                let diff = Math.abs(scoreA - scoreB);

                                if (diff <= 1) {
                                    validCombinations.push({ assignA, assignB, scoreA, scoreB, diff });
                                }
                            }
                        }
                    }
                }
            }

            if (validCombinations.length === 0) {
                alert("선택한 인원, 포지션 고정 및 팀 고정 조건으로 밸런스 있는 팀을 구성할 수 없습니다. (고정 조건을 확인해 주세요)");
                return;
            }

            let selected = validCombinations[Math.floor(Math.random() * validCombinations.length)];
            
            const resultEl = document.getElementById("result");
            const boxA = document.getElementById("teamA-box");
            const boxB = document.getElementById("teamB-box");
            
            resultEl.style.display = "flex";
            boxA.classList.remove("team-box-a");
            boxB.classList.remove("team-box-b");
            void boxA.offsetWidth;
            boxA.classList.add("team-box-a");
            boxB.classList.add("team-box-b");

            renderTeam("teamA", selected.assignA, selected.scoreA);
            renderTeam("teamB", selected.assignB, selected.scoreB);
        }

        function renderTeam(elementPrefix, assignedTeam, score) {
            let teamNameJp = elementPrefix === "teamA" ? "チームA" : "チームB";
            let teamNameKr = elementPrefix === "teamA" ? "A팀 🔷" : "B팀 🔴";
            
            document.getElementById(elementPrefix + "-title").innerText = `${teamNameKr} (${teamNameJp}) - ${score}점`;
            let listEl = document.getElementById(elementPrefix + "-list");
            listEl.innerHTML = "";

            const roleOrder = { "탱": 1, "딜": 2, "힐": 3 };
            assignedTeam.sort((a, b) => roleOrder[a.assignedRole] - roleOrder[b.assignedRole]);

            assignedTeam.forEach((item, idx) => {
                let li = document.createElement("li");
                
                let borderClass = item.assignedRole === "탱" ? "role-tank-border" : (item.assignedRole === "딜" ? "role-damage-border" : "role-support-border");
                let roleClass = item.assignedRole === "탱" ? "role-tank" : (item.assignedRole === "딜" ? "role-damage" : "role-support");
                
                let roleIcon = item.assignedRole === "탱" ? "🛡️" : (item.assignedRole === "딜" ? "⚔️" : "🌿");
                let jpRole = roleJpMap[item.assignedRole];
                let jptier = tierJpMap[item.tierName] || item.tierName;
                let tooltipHtml = getPlayerRolesTooltipHtml(item.player.roles);

                li.className = `${borderClass} has-tooltip`;
                li.style.animationDelay = `${idx * 0.08}s`;
                
                li.innerHTML = `
                    <div class="tooltip-box">${tooltipHtml}</div>
                    <div class="player-info">
                        <span class="player-name">${item.player.name}</span>
                        <span class="tier-badge tier-${item.tierName}">${item.tierName} / ${jptier}</span>
                    </div>
                    <span class="role-text ${roleClass}">[${roleIcon} ${item.assignedRole} / ${jpRole}]</span>
                `;
                listEl.appendChild(li);
            });
        }

        window.onload = function() {
            initTierScoreUI();
            initPlayerCheckboxes();
        };
    </script>
</body>
</html>
